  main-db:
    image: postgres:15
    environment:
      POSTGRES_DB: asset_platform_main
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5434:5432"
    volumes:
      - main_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d asset_platform_main"]
      interval: 10s
      timeout: 5s
      retries: 5

  files-db:
    image: postgres:15
    environment:
      POSTGRES_DB: asset_platform_files
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"  # Different port to avoid conflict
    volumes:
      - files_db_data:/var/lib/postgresql/data
      - files_storage:/var/lib/postgresql/files
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d asset_platform_files"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  main_db_data:
    driver: local
  files_db_data:
    driver: local
  files_storage:
    driver: local
    # Remove tmpfs for persistent storage
    # driver_opts:
    #   type: tmpfs
    #   device: tmpfs
    #   o: size=5g